plugins {
    id("org.springframework.boot") version "3.4.4"
    id("io.spring.dependency-management") version "1.1.7"
    id("io.freefair.lombok") version "8.13.1"
    id 'java'
    id 'org.liquibase.gradle' version '2.2.0'
}
apply from: 'version.gradle'

group = 'com.voedev'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    implementation 'org.springframework.boot:spring-boot-starter-security'
    testImplementation 'org.springframework.security:spring-security-test'

    runtimeOnly "org.postgresql:postgresql:${versions.postgres}"
    implementation 'org.liquibase:liquibase-core'
    implementation 'org.springframework.kafka:spring-kafka'

    // JWT
    implementation("io.jsonwebtoken:jjwt-api:${versions.jjwt}")
    runtimeOnly("io.jsonwebtoken:jjwt-impl:${versions.jjwt}")
    runtimeOnly("io.jsonwebtoken:jjwt-jackson:${versions.jjwt}")

    // MapStruct
    implementation "org.mapstruct:mapstruct:${versions.mapstruct}"
    annotationProcessor "org.mapstruct:mapstruct-processor:${versions.mapstruct}"

    // Swagger
    implementation("org.springdoc:springdoc-openapi-starter-webmvc-ui:${versions.swagger}")

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation("org.springframework.kafka:spring-kafka-test")

    // Testcontainers
    testImplementation "org.testcontainers:testcontainers:${versions.testcontainers}"
    testImplementation "org.testcontainers:junit-jupiter:${versions.testcontainers}"
    testImplementation("org.testcontainers:postgresql:${versions.postgresqlcontainer}")
}

test {
    useJUnitPlatform()
}
