spring:
  application:
    name: finance-manager

  datasource:
    username: postgres
    password: pass
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5434/postgres
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        show_sql: true
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    contexts: dev,test

server:
  port: 8086